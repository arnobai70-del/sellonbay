name: One-time verified SellOnBay source import
on:
  push:
    branches:
      - import/sellonbay-main-source
    paths:
      - .github/workflows/one-time-source-import.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import byte-identical verified source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="08057c3a7bd5485579b391d9abf8842b7fd7fd51"
          SOURCE_COMMIT="a085a97dddefb7f5ec7f62cbbd8d1a9e20d52086"
          git fetch --no-tags --depth=1 https://github.com/emonkhanlamu-hue/sellonbay.git "$SOURCE_COMMIT"
          git read-tree --reset -u "FETCH_HEAD^{tree}"
          TREE="$(git write-tree)"
          test "$TREE" = "$EXPECTED_SHA" || { echo "Wrong source tree: $TREE"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import verified SellOnBay main project (491 files)"
          git push origin HEAD:import/sellonbay-main-source
